services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dating_quiz}
      POSTGRES_USER: ${POSTGRES_USER:-dating_quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dating_quiz}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dating_quiz} -d ${POSTGRES_DB:-dating_quiz}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    pull_policy: always
    env_file:
      - .env
    environment:
      SITE_PUBLIC_BASE_URL: http://127.0.0.1:${TEST_SITE_PORT:-18081}
      PAY_PUBLIC_BASE_URL: http://127.0.0.1:${TEST_PAY_PORT:-18083}
      APP_PUBLIC_BASE_URL: http://127.0.0.1:${TEST_APP_PORT:-18085}
      API_PUBLIC_BASE_URL: http://127.0.0.1:${TEST_BACKEND_PORT:-18000}
      BACKEND_CORS_ALLOW_ORIGINS: http://127.0.0.1:${TEST_SITE_PORT:-18081},http://127.0.0.1:${TEST_LANDING_PORT:-18082},http://127.0.0.1:${TEST_PAY_PORT:-18083},http://127.0.0.1:${TEST_APP_PORT:-18085}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    pull_policy: always
    env_file:
      - .env
    environment:
      BOT_MODE: ${BOT_MODE:-polling}
      BOT_BACKEND_BASE_URL: http://backend:8000
      APP_PUBLIC_BASE_URL: http://127.0.0.1:${TEST_SITE_PORT:-18081}
      PAY_PUBLIC_BASE_URL: http://127.0.0.1:${TEST_PAY_PORT:-18083}
      BOT_PAY_URL: http://127.0.0.1:${TEST_PAY_PORT:-18083}/ru/pay/manage
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    expose:
      - "${BOT_PORT:-8081}"

  frontend-site:
    build:
      context: .
      dockerfile: frontend-site/Dockerfile
    pull_policy: always
    env_file:
      - .env
    environment:
      APP_SURFACE: site
      API_BASE_URL: http://127.0.0.1:${TEST_BACKEND_PORT:-18000}
      PRIMARY_LANDING_URL: http://127.0.0.1:${TEST_LANDING_PORT:-18082}/en/quiz/1
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEST_SITE_PORT:-18081}:80"

  frontend-landing:
    build:
      context: .
      dockerfile: frontend-landing/Dockerfile
    pull_policy: always
    env_file:
      - .env
    environment:
      APP_SURFACE: landing
      API_BASE_URL: http://127.0.0.1:${TEST_BACKEND_PORT:-18000}
      PAY_PUBLIC_BASE_URL: http://127.0.0.1:${TEST_PAY_PORT:-18083}
      VITE_MOBI_SLON_URL: ${VITE_MOBI_SLON_URL:-https://mobi-slon.com/index.php}
      VITE_MOBI_SLON_CAMPAIGN_KEY: ${VITE_MOBI_SLON_CAMPAIGN_KEY:-}
      VITE_FB_PIXEL_ID: ${VITE_FB_PIXEL_ID:-}
      VITE_YANDEX_METRIKA_ID: ${VITE_YANDEX_METRIKA_ID:-}
      VITE_TRACKING_DEBUG: ${VITE_TRACKING_DEBUG:-0}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEST_LANDING_PORT:-18082}:80"

  frontend-pay:
    build:
      context: .
      dockerfile: frontend-pay/Dockerfile
    pull_policy: always
    env_file:
      - .env
    environment:
      APP_SURFACE: pay
      API_BASE_URL: http://127.0.0.1:${TEST_BACKEND_PORT:-18000}
      PAY_PUBLIC_BASE_URL: http://127.0.0.1:${TEST_PAY_PORT:-18083}
      VITE_MOBI_SLON_URL: ${VITE_MOBI_SLON_URL:-https://mobi-slon.com/index.php}
      VITE_MOBI_SLON_CAMPAIGN_KEY: ${VITE_MOBI_SLON_CAMPAIGN_KEY:-}
      VITE_FB_PIXEL_ID: ${VITE_FB_PIXEL_ID:-}
      VITE_YANDEX_METRIKA_ID: ${VITE_YANDEX_METRIKA_ID:-}
      VITE_TRACKING_DEBUG: ${VITE_TRACKING_DEBUG:-0}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEST_PAY_PORT:-18083}:80"

  frontend-app:
    build:
      context: .
      dockerfile: frontend-app/Dockerfile
    pull_policy: always
    env_file:
      - .env
    environment:
      APP_SURFACE: app
      API_BASE_URL: http://127.0.0.1:${TEST_BACKEND_PORT:-18000}
      PAY_PUBLIC_BASE_URL: http://127.0.0.1:${TEST_PAY_PORT:-18083}
      APP_PUBLIC_BASE_URL: http://127.0.0.1:${TEST_APP_PORT:-18085}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEST_APP_PORT:-18085}:80"

volumes:
  postgres_data:
