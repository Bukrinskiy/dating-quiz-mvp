services:
  postgres:
    image: postgres:17-alpine
    pull_policy: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dating_quiz}
      POSTGRES_USER: ${POSTGRES_USER:-dating_quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dating_quiz}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dating_quiz} -d ${POSTGRES_DB:-dating_quiz}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ${DOCKER_REPO:-artyom85/seranking-server}:backend-${IMAGE_TAG:-latest}
    pull_policy: always
    env_file:
      - .env
    environment:
      SITE_PUBLIC_BASE_URL: ${SITE_PUBLIC_BASE_URL:-https://flirto.guru}
      PAY_PUBLIC_BASE_URL: ${PAY_PUBLIC_BASE_URL:-https://pay.flirto.guru}
      APP_PUBLIC_BASE_URL: ${APP_APP_PUBLIC_BASE_URL:-https://app.flirto.guru}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-https://api.flirto.guru}
      BACKEND_CORS_ALLOW_ORIGINS: ${BACKEND_CORS_ALLOW_ORIGINS:-https://flirto.guru,https://pay.flirto.guru,https://app.flirto.guru,https://lp1.flirto.guru}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  bot:
    image: ${DOCKER_REPO:-artyom85/seranking-server}:bot-${IMAGE_TAG:-latest}
    pull_policy: always
    env_file:
      - .env
    environment:
      BOT_MODE: ${BOT_MODE:-webhook}
      BOT_BACKEND_BASE_URL: http://backend:8000
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://flirto.guru}
      PAY_PUBLIC_BASE_URL: ${PAY_PUBLIC_BASE_URL:-https://pay.flirto.guru}
      BOT_PAY_URL: ${BOT_PAY_URL:-https://pay.flirto.guru/ru/pay/manage}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 20s
    expose:
      - "${BOT_PORT:-8081}"
    ports:
      - "127.0.0.1:${BOT_PORT:-8081}:${BOT_PORT:-8081}"

  frontend-site:
    image: ${DOCKER_REPO:-artyom85/seranking-server}:frontend-site-${IMAGE_TAG:-latest}
    pull_policy: always
    env_file:
      - .env
    environment:
      APP_SURFACE: ${SITE_APP_SURFACE:-site}
      APP_BRAND: ${SITE_APP_BRAND:-Flirto Guru}
      API_BASE_URL: ${SITE_API_BASE_URL:-https://api.flirto.guru}
      APP_PUBLIC_BASE_URL: ${SITE_APP_PUBLIC_BASE_URL:-https://app.flirto.guru}
      PRIMARY_LANDING_URL: ${SITE_PRIMARY_LANDING_URL:-https://lp1.flirto.guru/en/quiz/1}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SITE_PORT:-8082}:80"

  frontend-landing:
    image: ${DOCKER_REPO:-artyom85/seranking-server}:frontend-landing-${IMAGE_TAG:-latest}
    pull_policy: always
    env_file:
      - .env
    environment:
      APP_SURFACE: ${LANDING_APP_SURFACE:-landing}
      API_BASE_URL: ${LANDING_API_BASE_URL:-https://api.flirto.guru}
      PAY_PUBLIC_BASE_URL: ${LANDING_PAY_PUBLIC_BASE_URL:-https://pay.flirto.guru}
      VITE_MOBI_SLON_URL: ${VITE_MOBI_SLON_URL:-https://mobi-slon.com/index.php}
      VITE_MOBI_SLON_CAMPAIGN_KEY_FACEBOOK: ${VITE_MOBI_SLON_CAMPAIGN_KEY_FACEBOOK:-}
      VITE_MOBI_SLON_CAMPAIGN_KEY_GOOGLE: ${VITE_MOBI_SLON_CAMPAIGN_KEY_GOOGLE:-}
      VITE_GOOGLE_ADS_ID: ${VITE_GOOGLE_ADS_ID:-}
      VITE_FB_PIXEL_ID: ${VITE_FB_PIXEL_ID:-}
      VITE_YANDEX_METRIKA_ID: ${VITE_YANDEX_METRIKA_ID:-}
      VITE_TRACKING_DEBUG: ${VITE_TRACKING_DEBUG:-0}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LANDING_PORT:-8083}:80"

  frontend-pay:
    image: ${DOCKER_REPO:-artyom85/seranking-server}:frontend-pay-${IMAGE_TAG:-latest}
    pull_policy: always
    env_file:
      - .env
    environment:
      APP_SURFACE: ${PAY_APP_SURFACE:-pay}
      API_BASE_URL: ${PAY_API_BASE_URL:-https://api.flirto.guru}
      PAY_PUBLIC_BASE_URL: ${PAY_PUBLIC_BASE_URL:-https://pay.flirto.guru}
      VITE_FB_PIXEL_ID: ${VITE_FB_PIXEL_ID:-}
      VITE_YANDEX_METRIKA_ID: ${VITE_YANDEX_METRIKA_ID:-}
      VITE_TRACKING_DEBUG: ${VITE_TRACKING_DEBUG:-0}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAY_PORT:-8084}:80"

  frontend-app:
    image: ${DOCKER_REPO:-artyom85/seranking-server}:frontend-app-${IMAGE_TAG:-latest}
    pull_policy: always
    env_file:
      - .env
    environment:
      APP_SURFACE: ${APP_FRONTEND_SURFACE:-app}
      API_BASE_URL: ${APP_API_BASE_URL:-https://api.flirto.guru}
      PAY_PUBLIC_BASE_URL: ${PAY_PUBLIC_BASE_URL:-https://pay.flirto.guru}
      APP_PUBLIC_BASE_URL: ${APP_APP_PUBLIC_BASE_URL:-https://app.flirto.guru}
      LANDING_PUBLIC_BASE_URL: ${APP_LANDING_PUBLIC_BASE_URL:-https://lp1.flirto.guru}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8085}:80"

volumes:
  postgres_data:
