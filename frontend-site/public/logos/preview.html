<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flirto.Guru Logo Variants</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f4f7; padding: 40px; }
  h1 { text-align: center; color: #3b2b5b; margin-bottom: 40px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; max-width: 1000px; margin: 0 auto; }
  .card { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  .card h2 { color: #8244a2; font-size: 16px; margin-bottom: 20px; }
  .row { display: flex; align-items: center; gap: 24px; margin-bottom: 16px; }
  .label { font-size: 12px; color: #999; min-width: 60px; }
  .dark { background: #1a1a2e; }
  .dark h2 { color: #fd7f72; }
  .dark .label { color: #666; }
  img { max-width: 100%; height: auto; }
  .icon-img { width: 64px; height: 64px; }
  .icon-sm { width: 32px; height: 32px; }
  .icon-xs { width: 16px; height: 16px; }
</style>
</head>
<body>
<h1>Flirto.Guru — Logo Variants</h1>
<div class="grid">

  <div class="card">
    <h2>1. Minimalist / Modern</h2>
    <div class="row">
      <span class="label">Full:</span>
      <img src="logo-minimal-full.svg" alt="Minimal full">
    </div>
    <div class="row">
      <span class="label">Icon 64:</span>
      <img src="logo-minimal-icon.svg" class="icon-img" alt="Minimal icon 64">
      <span class="label">32:</span>
      <img src="logo-minimal-icon.svg" class="icon-sm" alt="Minimal icon 32">
      <span class="label">16:</span>
      <img src="logo-minimal-icon.svg" class="icon-xs" alt="Minimal icon 16">
    </div>
  </div>

  <div class="card">
    <h2>2. Playful / Fun</h2>
    <div class="row">
      <span class="label">Full:</span>
      <img src="logo-playful-full.svg" alt="Playful full">
    </div>
    <div class="row">
      <span class="label">Icon 64:</span>
      <img src="logo-playful-icon.svg" class="icon-img" alt="Playful icon 64">
      <span class="label">32:</span>
      <img src="logo-playful-icon.svg" class="icon-sm" alt="Playful icon 32">
      <span class="label">16:</span>
      <img src="logo-playful-icon.svg" class="icon-xs" alt="Playful icon 16">
    </div>
  </div>

  <div class="card">
    <h2>3. Elegant / Premium</h2>
    <div class="row">
      <span class="label">Full:</span>
      <img src="logo-elegant-full.svg" alt="Elegant full">
    </div>
    <div class="row">
      <span class="label">Icon 64:</span>
      <img src="logo-elegant-icon.svg" class="icon-img" alt="Elegant icon 64">
      <span class="label">32:</span>
      <img src="logo-elegant-icon.svg" class="icon-sm" alt="Elegant icon 32">
      <span class="label">16:</span>
      <img src="logo-elegant-icon.svg" class="icon-xs" alt="Elegant icon 16">
    </div>
  </div>

  <div class="card dark">
    <h2>4. Bold / Edgy</h2>
    <div class="row">
      <span class="label">Full:</span>
      <img src="logo-bold-full.svg" alt="Bold full">
    </div>
    <div class="row">
      <span class="label">Icon 64:</span>
      <img src="logo-bold-icon.svg" class="icon-img" alt="Bold icon 64">
      <span class="label">32:</span>
      <img src="logo-bold-icon.svg" class="icon-sm" alt="Bold icon 32">
      <span class="label">16:</span>
      <img src="logo-bold-icon.svg" class="icon-xs" alt="Bold icon 16">
    </div>
  </div>

</div>
</body>
</html>
