<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="elegGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b2b5b"/>
      <stop offset="1" stop-color="#8244a2"/>
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#elegGrad)" stroke-width="1.5"/>
  <!-- Inner circle -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#elegGrad)" stroke-width="0.5"/>
  <!-- Elegant F — thin strokes, centered in the circle -->
  <!-- Vertical stem with serifs -->
  <path d="
    M21 15 H24 V46 H21 Z
    M18 15 H24 V17.5 H18 Z
    M18 43.5 H24 V46 H18 Z
  " fill="url(#elegGrad)" fill-rule="evenodd"/>
  <!-- Top horizontal bar — thin, elegant -->
  <path d="M24 15 H43 V17 H24 Z" fill="url(#elegGrad)"/>
  <!-- Middle crossbar -->
  <path d="M24 29.5 H37 V31.5 H24 Z" fill="url(#elegGrad)"/>
