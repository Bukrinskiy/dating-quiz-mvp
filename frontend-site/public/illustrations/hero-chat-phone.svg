    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffefd"/>
      <stop offset="100%" stop-color="#fff1f5"/>
    </linearGradient>
  </defs>
  <rect width="920" height="980" rx="64" fill="url(#bg)"/>
  <circle cx="177" cy="176" r="98" fill="#ffffff" opacity=".66"/>
  <circle cx="774" cy="254" r="66" fill="#ffc0d3" opacity=".52"/>
  <circle cx="710" cy="802" r="110" fill="#ffffff" opacity=".7"/>
