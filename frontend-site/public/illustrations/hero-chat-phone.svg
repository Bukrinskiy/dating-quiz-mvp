  <rect x="366" y="178" width="96" height="12" rx="6" fill="#9d91a8" opacity=".75"/>

  <rect x="318" y="234" width="220" height="86" rx="28" fill="#ffffff"/>
  <text x="346" y="273" font-size="24" font-family="Arial, sans-serif" fill="#2c2433">Hey, free on Friday?</text>
  <text x="346" y="301" font-size="18" font-family="Arial, sans-serif" fill="#8b7c91">Short, clear, confident.</text>

  <rect x="392" y="350" width="208" height="92" rx="28" fill="#ff8fad"/>
  <text x="420" y="390" font-size="24" font-family="Arial, sans-serif" fill="#ffffff">That sounds good :)</text>
  <text x="420" y="419" font-size="18" font-family="Arial, sans-serif" fill="#fff7fb" opacity=".9">Warm reply. Keep momentum.</text>

  <rect x="318" y="474" width="244" height="104" rx="28" fill="#ffffff"/>
  <text x="346" y="514" font-size="23" font-family="Arial, sans-serif" fill="#2c2433">Perfect. 7pm works.</text>
  <text x="346" y="545" font-size="18" font-family="Arial, sans-serif" fill="#8b7c91">No overthinking. Just move it forward.</text>

  <rect x="316" y="706" width="286" height="108" rx="30" fill="#fff3f7"/>
  <rect x="344" y="736" width="160" height="16" rx="8" fill="#ec7394"/>
  <rect x="344" y="766" width="228" height="12" rx="6" fill="#c8b4bc"/>
  <rect x="344" y="790" width="184" height="12" rx="6" fill="#d7c8cf"/>

